openapi: 3.1.0
info:
  title: Vestaron Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: 'Public read surface of vestaron.com content: news releases, articles, recognitions and video/podcast
    posts, product and company pages, the media library (product labels, safety data sheets, technical bulletins),
    taxonomies and a site-wide search endpoint.'
  description: 'Vestaron publishes vestaron.com on WordPress, which exposes the WordPress REST API at https://vestaron.com/wp-json/.
    The wp/v2 namespace is anonymously readable and returns the company newsroom (94 posts across the News, Articles,
    Recognitions and Video/Podcasts categories), 34 product and company pages, an 829-item media library and a site-wide
    search endpoint as JSON.


    This document was DERIVED mechanically by API Evangelist from the route-discovery document served at https://vestaron.com/wp-json/
    on 2026-08-05 — every path, method, parameter, enum, default and description below is taken verbatim from that
    descriptor. Vestaron does not publish an OpenAPI definition of its own, and this is not a product API: it is
    the content API the CMS exposes. Write operations exist on these routes but require authentication; the /wp/v2/users
    and /wp/v2/settings collections return 401 to anonymous callers.'
  contact:
    name: Vestaron
    url: https://vestaron.com/contact/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://vestaron.com/wp-json/
  x-derived-on: '2026-08-05'
  x-provider-published: false
servers:
- url: https://vestaron.com/wp-json
  description: Production
tags:
- name: Comments
- name: Discovery
- name: Media
- name: Pages
- name: Posts
- name: Search
- name: Settings
- name: Taxonomy
- name: Users
security:
