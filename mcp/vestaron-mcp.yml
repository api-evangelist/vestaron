tools: []
tools_note: NOT ENUMERATED. An anonymous JSON-RPC tools/list against https://vestaron.com/wp-json/mcp/mcp-oauth-server
  returns HTTP 401 {"code":"mcp_unauthorized","message":"MCP authentication required."}; the same call
  against /wp-json/mcp/mcp-adapter-default-server returns HTTP 401 rest_forbidden, as does the wp-abilities/v1
  registry. The live tool schemas therefore require an authorized OAuth session with the mcp scope. No
  tool list is asserted here, and none was derived — Vestaron publishes no llms.txt or MCP documentation
  to fall back on.
scope_note: This server fronts the vestaron.com WordPress content estate (marketing site, newsroom, media
