- aid: vestaron:mcp
  name: Vestaron MCP Server (WordPress MCP Adapter)
  description: >-
    A remote Model Context Protocol server published on the vestaron.com host and advertised
    anonymously through RFC 8414 OAuth authorization-server metadata and RFC 9728
    protected-resource metadata. The server fronts the vestaron.com WordPress content estate —
    the marketing site, newsroom and media library — not any crop-protection product system.
    Authorization is OAuth 2.1 authorization-code with mandatory PKCE (S256), a single `mcp`
    scope, public clients (token_endpoint_auth_methods none), refresh tokens and client-ID
    metadata documents. tools/list is authenticated: an anonymous JSON-RPC call returns HTTP 401
    mcp_unauthorized, and the backing wp-abilities/v1 registry returns 401 rest_forbidden, so
    the live tool schemas require an authorized session and no tool list is asserted here.
  humanURL: https://vestaron.com/wp-json/mcp
  baseURL: https://vestaron.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Content
  properties:
  - type: MCPServer
    url: mcp/vestaron-mcp.yml
  - type: ToolCrosswalk
    url: mcp/vestaron-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/vestaron-scopes.yml
  - type: Authentication
    url: authentication/vestaron-authentication.yml
