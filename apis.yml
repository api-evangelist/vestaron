aid: vestaron
name: Vestaron
description: >-
  Vestaron is an agricultural biotechnology company founded in 2005 and headquartered in
  Kalamazoo, Michigan, that develops peptide-based bioinsecticides derived from the venom of
  spiders and other venomous species. Its peptides deliver insecticidal modes of action that had
  never before been used for insect control — SPEAR, the first commercialised active ingredient,
  introduced IRAC Group 32, the first new neuromuscular mode of action since the diamides — and
  are effective on lepidopteran and sucking pests while remaining gentle on pollinators and
  beneficial insects. The commercial portfolio is SPEAR LEP, SPEAR RC, SPEAR T, BASIN FLEX,
  LEPROTEC and LEPROTEC WG, manufactured in partnership with ADM. The company has won the Crop
  Science Award and an EPA Green Chemistry Challenge award, and in 2024 became the first
  agriculture and food company inducted into the Global CleanTech 100 Hall of Fame. Vestaron
  publishes no developer program, no product API and no API documentation. The only
  machine-readable surfaces on vestaron.com are the WordPress REST content API (wp/v2), which is
  anonymously readable and serves the corporate newsroom, product and company pages and media
  library, and an OAuth-gated Model Context Protocol endpoint advertised through RFC 8414 and
  RFC 9728 metadata.
