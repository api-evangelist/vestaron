x-coverage:
  state: covered
  reason: null
  detail: >-
    Contract discovery succeeded on a company that ships no software. vestaron.com is WordPress
    behind a catch-all front controller that answers HTTP 200 with a 122,173-byte HTML shell for
    every unmatched path — so every /.well-known/ and /openapi.json probe was diffed against a
    control 404 before being believed. Two real machine-readable surfaces survived that diff: the
    anonymously readable WordPress REST content API at /wp-json/wp/v2 (37 paths, 89 operations
    derived from the site's own route index) and an OAuth-gated MCP endpoint at
    /wp-json/mcp/mcp-oauth-server advertised through RFC 8414 and RFC 9728 metadata. Vestaron
    publishes no OpenAPI, no A2A agent card, no security.txt, no SDKs and no developer program;
    those absences are recorded as absences, not as 200s.
  evidence:
  - url: https://vestaron.com/wp-json/
    status: 200
  - url: https://vestaron.com/.well-known/oauth-protected-resource
    status: 200
  - url: https://vestaron.com/wp-json/mcp/mcp-oauth-server
    status: 401
  - url: https://vestaron.com/.well-known/agent-card.json
    status: 200
  - url: https://vestaron.com/zzz-nonexistent-path-9182
    status: 200
  checked: '2026-08-05'
