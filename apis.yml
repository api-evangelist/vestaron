apis:
- aid: vestaron:content
  name: Vestaron Content API (WordPress REST wp/v2)
  description: >-
    The anonymously readable WordPress REST API that vestaron.com serves at /wp-json/wp/v2 — the
    corporate newsroom (94 published posts spanning 2015-06-12 to 2026-03-11 across the News,
    Articles, Recognitions and Video/Podcasts categories), 34 product and company pages
    (SPEAR RC, SPEAR T, LEPROTEC, LEPROTEC WG, the products overview, About Us, Science,
    Sustainability, Bee Friendly, Resources, Downloads, Contact and the per-jurisdiction legal
    pages), an 829-item media library, the category and year-tag taxonomies and a site-wide
    search endpoint indexing 128 objects — all as JSON with page/per_page pagination and
    X-WP-Total / X-WP-TotalPages / RFC 8288 Link headers. /wp/v2/users and /wp/v2/settings
    return 401 to anonymous callers and every write requires authentication. This is the CMS
    content API, not a crop-protection product API; Vestaron publishes no OpenAPI for it, so the
    definition in this repo was derived mechanically from the live route-discovery document at
    https://vestaron.com/wp-json/.
  humanURL: https://vestaron.com/news/
